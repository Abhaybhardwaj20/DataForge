services:
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataforge:local
    environment:
      DATAFORGE_S3_ENDPOINT: ${DATAFORGE_S3_ENDPOINT:-http://object-storage:9000}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      object-storage:
        condition: service_healthy
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/bronze:/app/data/bronze
      - ./data/silver:/app/data/silver
      - ./data/gold:/app/data/gold
      - ./data/quarantine:/app/data/quarantine
      - ./data/state:/app/data/state
      - ./reports:/app/reports
      - ./logs:/app/logs

  object-storage:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  rustfs-data: